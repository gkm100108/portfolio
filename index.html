<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GuGyeongMo—Portfolio</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg?v=2" />
  <link rel="shortcut icon" type="image/svg+xml" href="./favicon.svg?v=2" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css"
  />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <!-- 상단 네비게이션 (인쇄/PDF 저장 시 숨김 처리) -->
  <header class="site-header no-print">
    <div class="container header-inner">
      <a href="#top" class="brand" id="nav-brand">Portfolio</a>
      <nav class="nav-links" aria-label="주요 섹션">
        <a href="#about">소개</a>
        <a href="#skills">기술 스택</a>
        <a href="#projects">프로젝트</a>
        <a href="#experience">경험 및 활동</a>
        <a href="#contact">연락처</a>
      </nav>
      <button type="button" class="btn-pdf" id="download-pdf-btn">
        PDF 다운로드
      </button>
    </div>
  </header>

  <main id="top" class="container main-content">
    <!-- 1. Hero / 기본 프로필 -->
    <section class="hero section" id="hero">
      <p class="hero-role" id="hero-role">Frontend Developer</p>
      <h1 class="hero-title" id="hero-title">
        사용자 경험을 코드로 구현하는<br />프론트엔드 개발자입니다.
      </h1>
      <p class="hero-summary" id="hero-summary">
        여기에 본인의 핵심 강점과 개발 철학을 2~3줄로 작성해 주세요.
      </p>
      <div class="hero-links" id="hero-links"></div>
    </section>

    <!-- 2. About / 핵심 역량 -->
    <section class="section" id="about">
      <h2 class="section-title">About &amp; Core Strengths</h2>
      <div class="strengths-grid" id="strengths-grid"></div>
    </section>

    <!-- 3. Tech Stack -->
    <section class="section" id="skills">
      <h2 class="section-title">Tech Stack</h2>
      <div class="skills-grid" id="skills-grid"></div>
    </section>

    <!-- 4. Projects -->
    <section class="section" id="projects">
      <h2 class="section-title">Projects</h2>
      <div class="projects-list" id="projects-list"></div>
    </section>

    <!-- 5. Experience / Education / Awards -->
    <section class="section" id="experience">
      <h2 class="section-title">Experience &amp; Activities</h2>
      <div class="timeline-list" id="timeline-list"></div>
    </section>

    <!-- 6. Contact -->
    <section class="section contact-section" id="contact">
      <h2 class="section-title">Contact</h2>
      <div class="contact-card" id="contact-card"></div>
    </section>
  </main>

  <footer class="site-footer no-print">
    <div class="container">
      <p id="footer-text">© 2026 Frontend Portfolio. All rights reserved.</p>
    </div>
  </footer>

  <script src="./data.js"></script>
  <script src="./main.js"></script>
</body>
</html>
